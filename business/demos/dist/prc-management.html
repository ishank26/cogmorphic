<title>PRC work-order demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
/* Cogmorphic demo. Dark-first; amber = the one main action; state = glyph + word + color. */
:root {
  --bg: #0b0b0c;
  --raised: #111112;
  --sunk: #08080a;
  --line: #222120;
  --line-strong: #4a453e;
  --text: #f3eadb;
  --dim: #a59c8e;
  --faint: #8a8276;
  --accent: #ffb000;
  --accent-hover: #ffc233;
  --accent-ink: #160f00;
  --focus: #ffb000;
  --neutral: #a59c8e;
  --info: #7cc4ff;
  --review: #c9a7ff;
  --ok: #7dffcf;
  --bad: #ff7a59;
  --shadow: 0 12px 32px rgba(0, 0, 0, .5);
  --mono: 'Space Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 10px;
  --gap: clamp(12px, 2vw, 20px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f2ea; --raised: #fffdf8; --sunk: #efe9de; --line: #e2dacb; --line-strong: #b5ab99;
    --text: #1a1712; --dim: #5b5447; --faint: #6f6759;
    --accent: #ffb000; --accent-hover: #f0a400; --accent-ink: #160f00; --focus: #8a5a00;
    --neutral: #5b5447; --info: #0b5fa5; --review: #6b3fb8; --ok: #086647; --bad: #b42318;
    --shadow: 0 12px 32px rgba(40, 30, 10, .16);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f2ea; --raised: #fffdf8; --sunk: #efe9de; --line: #e2dacb; --line-strong: #b5ab99;
  --text: #1a1712; --dim: #5b5447; --faint: #6f6759;
  --accent: #ffb000; --accent-hover: #f0a400; --accent-ink: #160f00; --focus: #8a5a00;
  --neutral: #5b5447; --info: #0b5fa5; --review: #6b3fb8; --ok: #086647; --bad: #b42318;
  --shadow: 0 12px 32px rgba(40, 30, 10, .16);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.55 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: clip;
}
h1, h2, h3, p, ol, ul, dl, dd { margin: 0; }
ol, ul { padding: 0; list-style: none; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

/* Shell */
.demo {
  max-width: 1320px; margin: 0 auto;
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: clamp(20px, 3vw, 32px);
}
.demo__bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  min-height: 60px; border-bottom: 1px solid var(--line);
}
.brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -.01em; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.demo__for { color: var(--dim); font-size: .85rem; min-width: 0; }
.demo__badge {
  margin-left: auto; font: .68rem/1 var(--mono); text-transform: uppercase; letter-spacing: .12em;
  color: var(--dim); border: 1px dashed var(--line-strong); border-radius: 4px; padding: 6px 8px;
}

/* Desktop: numbers and pilot sit side by side; everything else spans */
@media (min-width: 960px) {
  .demo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .demo > * { grid-column: 1 / -1; }
  .demo > .numbers, .demo > .pilot { grid-column: auto; }
}

/* Quick win hero: the one h1 */
.win-hero { display: grid; gap: 14px; padding-top: clamp(8px, 3vw, 32px); }
.kicker { font: .72rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--dim); }
.win-hero__title {
  font-size: clamp(2.1rem, 6.2vw, 4.25rem); font-weight: 600; line-height: 1.02; letter-spacing: -.04em;
  max-width: 18ch; text-wrap: balance; overflow-wrap: break-word;
}
.win-hero__lede { font-size: clamp(1.05rem, 1.8vw, 1.3rem); color: var(--dim); max-width: 46ch; }

/* Try it: the live proof. A desk (sunk) holding a field and a document (raised) */
.try {
  min-width: 0; display: grid; gap: 12px; align-content: start;
  background: var(--sunk); border: 1px solid var(--line-strong); border-radius: var(--r);
  padding: clamp(16px, 3vw, 28px); box-shadow: var(--shadow);
}
.try > label { font-weight: 600; font-size: 1.05rem; }
.try__hint { margin-top: -6px; font-size: .88rem; color: var(--dim); }
.try__input, .numbers__grid input {
  width: 100%; min-width: 0; color: var(--text); background: var(--raised);
  border: 1px solid var(--faint); border-radius: 8px; padding: 12px 14px;
}
.try__input { min-height: 168px; resize: vertical; font: 16px/1.55 var(--sans); }
.try__input::placeholder { color: var(--faint); opacity: 1; }
.try__input:focus-visible, .numbers__grid input:focus-visible { border-color: var(--focus); border-radius: 8px; }
.try[data-mode="example"] .try__input {
  background: transparent; border-style: dashed; border-color: var(--line-strong); color: var(--dim);
  resize: none; cursor: default;
}
.try__actions { display: flex; flex-wrap: wrap; gap: 8px; }
.try__status { display: flex; gap: 8px; align-items: baseline; min-height: 1.55em; font-size: .88rem; color: var(--dim); }

.try__result {
  position: relative; min-width: 0; display: grid; gap: 12px; align-content: start;
  background: var(--raised); border: 1px solid var(--line-strong); border-radius: 8px;
  padding: clamp(16px, 2.6vw, 24px);
}
.try__kind, .try__replyto, .pilot__next, .numbers__label {
  font: .72rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--dim);
}
.try__kind { color: var(--text); padding-bottom: 10px; border-bottom: 2px solid var(--text); }
.try__fields { display: grid; grid-template-columns: fit-content(42%) minmax(0, 1fr); font-size: .92rem; }
.try__fields dt, .try__fields dd { padding: 8px 0; border-bottom: 1px solid var(--line); }
.try__fields dt {
  padding: 12px 16px 8px 0; font: .7rem/1.4 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
}
.try__fields dd { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.try__replyto { margin-top: 6px; }
.try__reply { white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch; font-size: .98rem; line-height: 1.6; }
.try__note { padding-top: 12px; border-top: 1px dashed var(--line-strong); font-size: .82rem; color: var(--dim); }

/* Example mode: dashed edges and a tag, so nobody mistakes it for live output */
.try[data-mode="example"] .try__result { border-style: dashed; }
.try[data-mode="example"] .try__result::before {
  content: "Example"; position: absolute; top: 0; right: 16px; transform: translateY(-50%);
  font: .64rem/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--dim);
  background: var(--sunk); border: 1px dashed var(--line-strong); border-radius: 4px; padding: 5px 7px;
}

/* Busy: a slow dot on the status line; text stays fully legible */
.try[data-mode="busy"] .try__status::before {
  content: ""; width: 8px; height: 8px; flex: none; align-self: center; border-radius: 50%;
  background: var(--info); animation: pulse 1.4s ease-in-out infinite;
}

@media (min-width: 960px) {
  .try { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); grid-template-rows: repeat(6, auto) 1fr; column-gap: clamp(20px, 3vw, 36px); }
  .try > * { grid-column: 1; }
  .try > .panel__title { grid-column: 1 / -1; }
  .try > .try__result { grid-column: 2; grid-row: 2 / -1; }
}

/* Your numbers: three inputs, one big figure */
.numbers__grid { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.numbers__grid > label { display: grid; gap: 6px; align-content: end; min-width: 0; font-size: .88rem; }
.numbers__grid input { min-height: 48px; padding: 10px 12px; background: var(--bg); font: 700 1.15rem/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.numbers__out { display: grid; gap: 8px; padding-top: 18px; border-top: 1px solid var(--line); }
.numbers__num {
  font: 700 clamp(3rem, 9vw, 5.25rem)/1 var(--mono); letter-spacing: -.04em;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
.numbers__note { font-size: .85rem; color: var(--dim); }

/* Pilot: terms, then a CSS staircase of what comes next */
.pilot__terms { display: grid; gap: 10px; }
.pilot__terms li { position: relative; padding-left: 26px; overflow-wrap: anywhere; }
.pilot__terms li::before { content: "\2713"; position: absolute; left: 0; font-weight: 700; color: var(--ok); }
.pilot__next { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.pilot__list {
  counter-reset: rung; display: grid; gap: 8px; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr);
  border-bottom: 2px solid var(--line-strong);
}
.pilot__list li {
  counter-increment: rung; display: grid; gap: 6px; align-content: start; min-width: 0;
  padding: 12px; background: var(--sunk); border: 1px solid var(--line); border-bottom: 0;
  border-top: 2px solid var(--line-strong); border-radius: 6px 6px 0 0;
  font-size: .9rem; font-weight: 500; overflow-wrap: anywhere;
}
.pilot__list li::before { content: counter(rung, decimal-leading-zero); font: .72rem/1 var(--mono); letter-spacing: .12em; color: var(--dim); }
.pilot__list li:nth-last-child(2) { margin-top: 24px; }
.pilot__list li:nth-last-child(3) { margin-top: 48px; }

/* Morning: the scripted workbench, second to the pilot */
.morning {
  min-width: 0; display: grid; gap: var(--gap);
  padding-top: clamp(24px, 4vw, 40px); border-top: 1px solid var(--line-strong);
}
.demo__promise { font-size: clamp(1rem, 1.4vw, 1.1rem); color: var(--text); max-width: 62ch; }
.demo__focus { color: var(--dim); max-width: 62ch; }
.demo__stats {
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  border-block: 1px solid var(--line);
}
.stat { padding: 16px 16px 14px 0; min-width: 0; }
.stat + .stat { padding-left: 16px; border-left: 1px solid var(--line); }
.stat__num {
  display: block; font: 500 clamp(1.8rem, 3.6vw, 2.6rem)/1 var(--sans);
  letter-spacing: -.03em; font-variant-numeric: tabular-nums;
}
.stat__label {
  display: block; margin-top: 8px; font: .68rem/1.2 var(--mono);
  text-transform: uppercase; letter-spacing: .12em; color: var(--dim);
}

/* Grid of panels */
.demo__grid { display: grid; gap: var(--gap); grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 720px) {
  .demo__grid { grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); }
  .demo__grid > .review { grid-column: 1 / -1; }
}
@media (min-width: 1120px) {
  .demo__grid { grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr) minmax(0, 1.1fr); }
  .demo__grid > .review { grid-column: auto; }
  .queue__list { max-height: min(64vh, 620px); overflow-y: auto; overscroll-behavior: contain; }
}
.queue, .work, .review, .log, .numbers, .pilot {
  min-width: 0; background: var(--raised); border: 1px solid var(--line); border-radius: var(--r);
  padding: 16px; display: grid; gap: 14px; align-content: start;
}
.panel__title {
  font: .72rem/1.3 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--dim);
  padding-bottom: 12px; border-bottom: 1px solid var(--line);
}

/* Queue */
.queue__list { display: grid; gap: 2px; margin: 0 -8px; padding: 0 8px; }
.queue__item {
  width: 100%; display: grid; gap: 4px 10px; text-align: left; cursor: pointer;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas: "chan from time" "subj subj subj" "stat stat stat";
  font: inherit; color: inherit; background: transparent;
  border: 0; border-left: 2px solid transparent; border-radius: 6px; padding: 12px 10px;
}
.queue__item:hover { background: var(--sunk); }
.queue__item[aria-current="true"] {
  background: var(--sunk); border-left-color: var(--text);
}
.queue__from { grid-area: from; font-weight: 600; font-size: .9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue__time { grid-area: time; font: .75rem/1.6 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }
.queue__subject { grid-area: subj; color: var(--dim); font-size: .88rem; overflow-wrap: anywhere; }
.queue__item > .status { grid-area: stat; justify-self: start; }

/* Channel chip: label in mono plus a shape mark per channel */
.chan {
  grid-area: chan;
  display: inline-flex; align-items: center; gap: 6px; align-self: center;
  font: .64rem/1 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--dim);
  border: 1px solid var(--line-strong); border-radius: 4px; padding: 4px 6px; white-space: nowrap;
}
.chan::before { content: ""; width: 7px; height: 7px; flex: none; background: currentColor; }
.chan[data-channel="email"]::before { height: 5px; }
.chan[data-channel="call"]::before { border-radius: 50%; }
.chan[data-channel="text"]::before { border-radius: 50% 50% 50% 0; }
.chan[data-channel="form"]::before { background: transparent; border: 1.5px solid currentColor; }
.chan[data-channel="sensor"]::before { transform: rotate(45deg); }
.chan[data-channel="system"]::before { width: 5px; height: 9px; }

/* Status pill: glyph + word + color */
.status {
  --c: var(--neutral);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font: .66rem/1 var(--mono); text-transform: uppercase; letter-spacing: .1em;
  color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent);
  background: color-mix(in srgb, var(--c) 10%, transparent);
  border-radius: 999px; padding: 4px 9px 4px 7px;
}
.status::before {
  content: ""; width: 8px; height: 8px; flex: none; border-radius: 50%;
  border: 1.5px solid currentColor; display: inline-grid; place-items: center;
}
.status[data-status="working"] { --c: var(--info); }
.status[data-status="working"]::before { border-top-color: transparent; animation: spin .8s linear infinite; }
.status[data-status="review"] { --c: var(--review); }
.status[data-status="review"]::before { border-radius: 1px; background: currentColor; transform: rotate(45deg) scale(.85); }
.status[data-status="approved"], .status[data-status="edited"] { --c: var(--ok); }
.status[data-status="edited"] { border-style: dashed; }
.status[data-status="rejected"] { --c: var(--bad); }
.status[data-status="approved"]::before, .status[data-status="edited"]::before,
.status[data-status="rejected"]::before {
  content: "\2713"; border: 0; width: auto; height: auto; font: 700 .8rem/1 var(--sans);
}
.status[data-status="rejected"]::before { content: "\2715"; }

/* Work: message + steps */
.message { display: grid; gap: 6px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.message__meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: .82rem; color: var(--dim); font-variant-numeric: tabular-nums; }
.message__subject { font-size: 1.1rem; font-weight: 600; letter-spacing: -.01em; line-height: 1.3; }
.message__body { color: var(--text); overflow-wrap: anywhere; max-width: 60ch; }

.steps { display: grid; }
.step {
  position: relative; display: grid; gap: 2px; padding: 0 0 14px 30px; min-height: 36px;
  transition: opacity .25s ease;
}
.step::before {
  content: ""; position: absolute; left: 0; top: 2px; width: 18px; height: 18px; border-radius: 50%;
  border: 1.5px solid var(--line-strong); background: var(--raised); z-index: 1;
  display: grid; place-items: center; font: 700 .7rem/1 var(--sans);
}
.step:not(:last-child)::after {
  content: ""; position: absolute; left: 8.5px; top: 22px; bottom: 2px; width: 1px; background: var(--line);
}
.step__system {
  font: .66rem/1.4 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--dim);
}
.step__text { font-size: .92rem; overflow-wrap: anywhere; }
.step[data-state="pending"] .step__text { color: var(--dim); }
.step[data-state="pending"] .step__system { color: var(--faint); }
.step[data-state="running"]::before { border-color: var(--info); border-top-color: transparent; animation: spin .8s linear infinite; }
.step[data-state="running"] .step__system { color: var(--info); }
.step[data-state="done"]::before { content: "\2713"; border-color: var(--ok); background: var(--ok); color: var(--bg); }
.step[data-state="done"]:not(:last-child)::after { background: color-mix(in srgb, var(--ok) 50%, var(--line)); }
.step[data-state="running"], .step[data-state="done"] { animation: rise .3s ease both; }
.work__run { justify-self: start; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px;
  font: 600 .92rem/1.2 var(--sans); color: var(--text); background: transparent; cursor: pointer;
  border: 1px solid var(--line-strong); border-radius: 999px; padding: .7em 1.3em;
  transition: background-color .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover { border-color: var(--text); }
.btn--primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn--primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn--ghost { border-color: transparent; color: var(--dim); }
.btn--ghost:hover { color: var(--text); border-color: var(--line-strong); }
.btn:focus-visible { outline-offset: 3px; border-radius: 999px; }
.btn:disabled {
  cursor: not-allowed; color: var(--faint); background: transparent; border-color: var(--line);
}

/* Review: draft */
.draft { display: grid; gap: 10px; }
.draft__kind {
  justify-self: start; font: .68rem/1 var(--mono); text-transform: uppercase; letter-spacing: .12em;
  color: var(--text); border: 1px solid var(--line-strong); border-radius: 4px; padding: 5px 7px;
}
.draft__to { font-weight: 600; overflow-wrap: anywhere; }
.draft__fields {
  display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px;
  padding: 10px 0; border-block: 1px solid var(--line); font-size: .88rem;
}
.draft__fields dt { color: var(--dim); }
.draft__fields dd { overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.draft__body {
  width: 100%; min-height: 168px; resize: vertical; font: inherit; font-size: .93rem; color: var(--text);
  background: var(--sunk); border: 1px solid transparent; border-radius: 6px; padding: 12px;
}
.draft__body:read-only { resize: none; cursor: default; }
.draft__body:read-write {
  background: var(--bg); border-color: var(--focus);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent);
}
.draft__body:read-write:focus-visible { outline: none; }
.draft__risk {
  display: flex; gap: 8px; align-items: baseline; font-size: .85rem; color: var(--text);
  border-left: 2px solid var(--bad); padding: 4px 0 4px 10px;
}
.draft__risk::before { content: "!"; font: 700 .8rem/1 var(--mono); color: var(--bad); }
.review__actions { display: flex; flex-wrap: wrap; gap: 8px; }
.review__done {
  display: flex; gap: 8px; align-items: baseline; font-size: .9rem; color: var(--text);
  border-left: 2px solid var(--ok); padding: 4px 0 4px 10px;
}
.review__done::before { content: "\2713"; color: var(--ok); font-weight: 700; }
.empty {
  display: grid; place-items: center; text-align: center; min-height: 220px; padding: 24px;
  color: var(--faint); font-size: .9rem; border: 1px dashed var(--line-strong); border-radius: 6px;
}

/* Audit trail */
.log__list { display: grid; font-size: .88rem; }
.log__entry {
  display: grid; grid-template-columns: 9ch minmax(0, 1fr); gap: 12px;
  padding: 9px 0; border-top: 1px solid var(--line); animation: rise .3s ease both;
}
.log__entry:first-child { border-top: 0; }
.log__entry time { font-family: var(--mono); font-size: .78rem; color: var(--faint); font-variant-numeric: tabular-nums; padding-top: 1px; }
.log__entry span { overflow-wrap: anywhere; }

/* Footer */
.demo__foot {
  display: grid; gap: 10px; justify-items: start; padding-top: 20px;
  border-top: 1px solid var(--line); font-size: .85rem; color: var(--dim);
}
.guardrail { color: var(--text); padding-left: 12px; border-left: 2px solid var(--ok); max-width: 70ch; }
.demo__note { color: var(--faint); max-width: 70ch; }

/* Toast */
.toast {
  position: fixed; left: 50%; z-index: 20; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px);
  background: var(--text); color: var(--bg); font-size: .9rem; font-weight: 500;
  border-radius: 8px; padding: 12px 16px; box-shadow: var(--shadow); animation: fade .2s ease both;
}
.toast:empty { display: none; }

/* Phone: queue becomes a strip that scrolls inside itself; stats one compact row */
@media (max-width: 719.98px) {
  .queue { padding-bottom: 10px; }
  .queue__list {
    display: flex; gap: 8px; margin: 0; padding: 0 0 6px; overflow-x: auto;
    overscroll-behavior-x: contain; scroll-snap-type: x proximity;
  }
